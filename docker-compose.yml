services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/trinetra.db
      DATABASE_MODE: sqlite
      GRAPH_MODE: local
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-before-any-deployment}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-TriNetraDemo!2026}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - trinetra_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - trinetra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra -d trinetra"]
      interval: 10s
      timeout: 5s
      retries: 5
  neo4j:
    image: neo4j:5-community
    profiles: ["full"]
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - trinetra_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
  redis:
    image: redis:7-alpine
    profiles: ["full"]
    command: redis-server --appendonly yes
    volumes:
      - trinetra_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: ./backend
    profiles: ["full"]
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_MODE: postgresql
      GRAPH_MODE: neo4j
      DATABASE_URL: postgresql+psycopg://trinetra@postgres:5432/trinetra
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  trinetra_data:
  trinetra_postgres:
  trinetra_neo4j:
  trinetra_redis:
